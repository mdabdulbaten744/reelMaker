    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.55 * v, when + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.035);
    n.connect(f); f.connect(g); g.connect(dst);
    n.start(when, ((seed || 0) * 0.041) % 0.5, 0.04);

    const osc = ctx.createOscillator(), og = ctx.createGain();
    osc.type = 'sine';
    const pitch = 150 + ((seed || 0) % 5) * 12;
    osc.frequency.setValueAtTime(pitch, when);
    osc.frequency.exponentialRampToValueAtTime(32, when + 0.04);
    og.gain.setValueAtTime(0.35 * v, when);
    og.gain.exponentialRampToValueAtTime(0.0001, when + 0.04);
    osc.connect(og); og.connect(dst);
    osc.start(when); osc.stop(when + 0.045);
  } else if (type === 'type') {
    /* Crisp mechanical keyboard click */
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = nbuf(ctx);
    f.type = 'bandpass';
    f.Q.value = 1.4;
    f.frequency.setValueAtTime(2100 * (1 + ((seed || 0) % 5 - 2) * 0.06), when);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.3 * v, when + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.028);
    n.connect(f); f.connect(g); g.connect(dst);
    n.start(when, ((seed || 0) * 0.023) % 0.5, 0.035);
  } else if (type === 'thud') {
    /* Sub bass kick punch on punchline hit */
    const osc = ctx.createOscillator(), og = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, when);
    osc.frequency.exponentialRampToValueAtTime(28, when + 0.22);
    og.gain.setValueAtTime(0.85 * v, when);
    og.gain.exponentialRampToValueAtTime(0.0001, when + 0.22);
    osc.connect(og); og.connect(dst);
    osc.start(when); osc.stop(when + 0.23);
  } else if (type === 'whoosh') {
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = nbuf(ctx);
    f.type = 'bandpass';
    f.Q.value = 0.85;
    f.frequency.setValueAtTime(380, when);
    f.frequency.exponentialRampToValueAtTime(3400, when + 0.35);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.5 * v, when + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.35);
    n.connect(f); f.connect(g); g.connect(dst);
    n.start(when, 0, 0.38);
  }
}

function emit(type, v = 1, seed = 0) {
  if (REC) REC.push({ t: +curT.toFixed(4), type, v, seed });
}

function resetSfxState() {
  lastIdx = -1;
  lastT = -1;
  lastN = -1;
}

function recordAudio() {
  REC = [{ t: 0, type: 'whoosh', v: 0.8, seed: 0 }];
  resetSfxState();
  for (let i = 0; i < DUR * 30; i++) renderFrame(i / 30);
  window.REEL.audioEvents = REC;
  REC = null;
  resetSfxState();
  renderFrame(0);
}

window.renderAudio = async () => {
  if (!window.REEL.audioEvents) recordAudio();
  const sr = 44100, ctx = new OfflineAudioContext(2, Math.round(sr * DUR), sr);
  const comp = ctx.createDynamicsCompressor(), m = ctx.createGain();
  m.gain.value = 0.95;
  m.connect(comp);
  comp.connect(ctx.destination);
  window.REEL.audioEvents.forEach(e => synth(ctx, m, e.type, e.t, e.v, e.seed));

  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const w = (o, t) => { for (let i = 0; i < t.length; i++) out.setUint8(o + i, t.charCodeAt(i)); };
  w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
  w(36, 'data'); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true);
    out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true);
  }
  const u8 = new Uint8Array(out.buffer);
  let bin = '';
  for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return btoa(bin);
};

/* -------------------------------------------------------------
   RENDER FRAME DETERMINISTIC LOGIC
------------------------------------------------------------- */
const card = $('card');
const cardLogo = $('card-logo');
const flash = $('flash');
const cnt = $('cnt');
const tag = $('tag');
const val = $('val');
const runner = $('runner');
const tyLine = $('ty-line');
const cur = $('cur');

const TXT_PART1 = "You are burning your capital ";
const TXT_PART2 = "on just a logo.";
const FULL_TXT = TXT_PART1 + TXT_PART2;

function renderFrame(t) {
  t = ((t % DUR) + DUR) % DUR;
  curT = t;

  /* Turnaround whoosh */
  if (lastT >= 0 && t < lastT - 0.5) emit('whoosh', 0.85);

  /* Runner bar */
  runner.style.width = ((t / DUR) * 100).toFixed(2) + '%';

  /* 1. Fast logo index (35 brands over 7.0 seconds => 0.20s per brand) */
  const N_BRANDS = BRANDS.length;
  const brandIdx = Math.min(N_BRANDS - 1, Math.floor((t / DUR) * N_BRANDS));

  if (brandIdx !== lastIdx) {
    const b = BRANDS[brandIdx];
    card.style.background = b[3];
    cardLogo.innerHTML = b[4];
    cnt.innerHTML = `<b>${String(brandIdx + 1).padStart(2, '0')}</b> / ${N_BRANDS}`;
    tag.textContent = b[1];
    val.textContent = b[2];
    emit('snap', 0.9, brandIdx);
    lastIdx = brandIdx;
  }

  /* Micro shutter flash on frame 0 of switch */
  const subProg = ((t / DUR) * N_BRANDS) % 1;
  flash.style.opacity = subProg < 0.22 ? (1 - subProg / 0.22) * 0.28 : 0;

  /* 2. Bottom typing text logic (Types 0.4s -> 2.9s, holds with thud, loops) */
  let chars = 0;
  if (t < 0.4) chars = 0;
  else if (t < 2.9) chars = Math.round(FULL_TXT.length * clamp((t - 0.4) / 2.5));
  else chars = FULL_TXT.length;

  if (chars !== lastN) {
    if (lastN >= 0 && chars > lastN) {
      emit('type', 0.75, chars);
      if (chars === FULL_TXT.length) emit('thud', 0.9, 99);
    }
    const currentTyped = FULL_TXT.slice(0, chars);
    if (chars <= TXT_PART1.length) {
      tyLine.innerHTML = currentTyped;
    } else {
      const p1 = TXT_PART1;
      const p2 = currentTyped.slice(TXT_PART1.length);
      tyLine.innerHTML = `${p1}<span class="hl">${p2}</span>`;
    }
    lastN = chars;
  }

  /* Cursor blink */
  const typing = t < 2.9;
  cur.style.opacity = (typing || Math.floor(t * 3.5) % 2 === 0) ? 1 : 0;

  lastT = t;
}
window.renderFrame = renderFrame;

/* Interactive Preview Scaler */
function preview() {
  const vp = $('vp');
  const f = () => {
    const s = Math.min(innerWidth / W, innerHeight / H);
    vp.style.transform = `scale(${s})`;
    vp.style.left = (innerWidth - W * s) / 2 + 'px';
    vp.style.top = (innerHeight - H * s) / 2 + 'px';
  };
  addEventListener('resize', f);
  f();
  const t0 = performance.now();
  (function lp() {
    renderFrame((performance.now() - t0) / 1000);
    requestAnimationFrame(lp);
  })();
}

/* Boot & Ready signal for render.py */
(async () => {
  try {
    await document.fonts.ready;
    renderFrame(0);
    if (RENDER) recordAudio();
    else preview();
    window.__reelReady = true;
  } catch (e) {
    window.__reelError = String(e && e.stack || e);
  }
})();
})();
</script>
