<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Great Brands — Wordmark Logos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root {
  --bg: #090a0f;
  --panel: #11131a;
  --line: rgba(255, 255, 255, 0.12);
  --acc: #ffd23f;
  --f-main: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  -webkit-font-smoothing: antialiased;
}
#vp {
  position: absolute;
  left: 0;
  top: 0;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: var(--bg);
  transform-origin: 0 0;
  font-family: var(--f-main);
  color: #fff;
}
.sec {
  position: absolute;
  left: 0;
  width: 1080px;
  height: 640px;
}

/* TOP SECTION: 100% STATIC (RULE 1) */
#top {
  top: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 70px;
  text-align: center;
}
.top-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 24px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #a0a6c0;
  margin-bottom: 28px;
}
.top-pill .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 10px #22c55e;
}
.top-title {
  font-weight: 800;
  font-size: 68px;
  line-height: 1.15;
  letter-spacing: -0.025em;
  color: #ffffff;
}
.top-title em {
  font-style: normal;
  color: var(--acc);
}

/* MIDDLE SECTION: FAST LOGO STAGE (RULE 3) */
#mid {
  top: 640px;
  overflow: hidden;
  background: var(--panel);
  border-top: 2px solid var(--line);
  border-bottom: 2px solid var(--line);
  box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Viewfinder Brackets & HUD */
.hud-corner {
  position: absolute;
  width: 32px;
  height: 32px;
  border-color: rgba(255, 255, 255, 0.35);
  border-style: solid;
  pointer-events: none;
  z-index: 10;
}
.hud-tl { top: 24px; left: 24px; border-width: 3px 0 0 3px; }
.hud-tr { top: 24px; right: 24px; border-width: 3px 3px 0 0; }
.hud-bl { bottom: 24px; left: 24px; border-width: 0 0 3px 3px; }
.hud-br { bottom: 24px; right: 24px; border-width: 0 3px 3px 0; }

.hud-topbar {
  position: absolute;
  top: 26px;
  left: 70px;
  right: 70px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
.hud-live {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #ff334b;
}
.hud-live-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ff334b;
  box-shadow: 0 0 8px #ff334b;
}
.hud-counter {
  color: #a0a6c0;
  background: rgba(0, 0, 0, 0.5);
  padding: 4px 16px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.hud-counter b { color: #fff; }

.hud-botbar {
  position: absolute;
  bottom: 24px;
  left: 70px;
  right: 70px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
  font-size: 19px;
  font-weight: 600;
  color: #8c93b0;
}
.hud-tag {
  color: #fff;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.hud-val {
  color: var(--acc);
  font-weight: 700;
  letter-spacing: 0.05em;
}

/* Card Canvas */
#card {
  position: relative;
  width: 980px;
  height: 480px;
  border-radius: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.12);
  transition: background 0.04s ease;
}

.slide {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px 60px;
}
.slide.active {
  display: flex;
}
.slide img {
  max-width: 82%;
  max-height: 250px;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
}

/* Micro-flash on switch */
#flash {
  position: absolute;
  inset: 0;
  background: #ffffff;
  pointer-events: none;
  opacity: 0;
  z-index: 12;
}

/* Loop progress bar */
#runner {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 5px;
  background: linear-gradient(90deg, #ffd23f, #ff4d4d);
  width: 0%;
  z-index: 15;
}

/* BOTTOM SECTION: PUNCHLINE */
#bot {
  top: 1280px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 80px;
  text-align: center;
}
.bot-box {
  width: 100%;
  max-width: 960px;
}
.bot-text {
  font-weight: 700;
  font-size: 64px;
  line-height: 1.18;
  letter-spacing: -0.02em;
  color: #ffffff;
}
.bot-text .hl {
  color: var(--acc);
}
.cursor {
  display: inline-block;
  width: 6px;
  height: 0.88em;
  margin-left: 6px;
  vertical-align: -0.08em;
  background: var(--acc);
}
.bot-sub {
  margin-top: 24px;
  font-size: 24px;
  color: #7b819f;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-weight: 600;
}
</style>
</head>
<body>
<div id="vp">
  <!-- TOP (STATIC) -->
  <div class="sec" id="top">
    <div class="top-pill"><span class="dot"></span>Branding Lesson</div>
    <h1 class="top-title">Great brands can have<br><em>text only logos.</em><br>Then why don’t you?</h1>
  </div>

  <!-- MIDDLE (FAST WORDMARKS) -->
  <div class="sec" id="mid">
    <div class="hud-corner hud-tl"></div>
    <div class="hud-corner hud-tr"></div>
    <div class="hud-corner hud-bl"></div>
    <div class="hud-corner hud-br"></div>

    <div class="hud-topbar">
      <div class="hud-live"><span class="hud-live-dot"></span>WORDMARK SHOWCASE</div>
      <div class="hud-counter" id="cnt"><b>01</b> / 24</div>
    </div>

    <div id="card">
      <!-- 24 Actual Wikimedia Commons SVG Slides -->
      <div id="slides-container"></div>
      <div id="flash"></div>
    </div>

    <div class="hud-botbar">
      <div class="hud-tag" id="tag">TECH TITAN</div>
      <div class="hud-val" id="val">NO ICON • 100% FONT</div>
    </div>
    <div id="runner"></div>
  </div>

  <!-- BOTTOM (TYPED CAPTION) -->
  <div class="sec" id="bot">
    <div class="bot-box">
      <div class="bot-text">
        <span id="ty-line"></span><span class="cursor" id="cur"></span>
      </div>
      <div class="bot-sub">Build the product first. Stop over-designing.</div>
    </div>
  </div>
</div>

<script>
(()=>{
const W = 1080, H = 1920, DUR = 7;
window.REEL = { width: W, height: H, fps: 30, duration: DUR, poster: 3.5 };
const RENDER = /[?&]render=1/.test(location.search);
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

/* -------------------------------------------------------------
   THE 24 OFFICIAL WIKIMEDIA COMMONS SVG LOGOS
   [Name, Tag, Sub, BackgroundColor, ImageURL, CSS Filter]
------------------------------------------------------------- */
const BRANDS = [
  /* 01 */
  ['SAMSUNG', 'GLOBAL TECHNOLOGY', 'KOREAN TECH LEADER', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/b/b4/Samsung_wordmark.svg', 'none'],

  /* 02 */
  ['UBER', 'MOBILITY & LOGISTICS', 'GLOBAL RIDE NETWORK', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/5/58/Uber_logo_2018.svg', 'none'],

  /* 03 */
  ['CANON', 'OPTICAL & CAMERAS', 'JAPANESE PRECISION', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/0/0a/Canon_wordmark.svg', 'none'],

  /* 04 */
  ['GUCCI', 'ITALIAN LUXURY', 'HIGH COUTURE HOUSE', '#f5f2ea',
   'https://upload.wikimedia.org/wikipedia/commons/2/2e/Gucci_Logo.svg', 'none'],

  /* 05 */
  ['CHANEL', 'PARISIAN HAUTE COUTURE', 'TIMELESS FASHION', '#000000',
   'https://upload.wikimedia.org/wikipedia/commons/3/35/Chanel_logo.svg', 'invert(1)'],

  /* 06 */
  ['SUPREME', 'STREETWEAR ICON', 'CULTURE PHENOMENON', '#111114',
   'https://upload.wikimedia.org/wikipedia/commons/2/28/Supreme_Logo.svg', 'none'],

  /* 07 */
  ['LOUIS VUITTON', 'FRENCH LUXURY', 'HISTORIC MAISON', '#f4efe8',
   'https://upload.wikimedia.org/wikipedia/commons/6/6a/Louis_Vuitton_logo.svg', 'none'],

  /* 08 */
  ['PRADA', 'MILANESE LUXURY', 'MINIMALIST LUXURY', '#08080a',
   'https://upload.wikimedia.org/wikipedia/commons/b/b8/Prada-Logo.svg', 'invert(1)'],

  /* 09 */
  ['ZARA', 'FASHION RETAIL', 'GLOBAL FAST FASHION', '#f3f2ee',
   'https://upload.wikimedia.org/wikipedia/commons/f/fd/Zara_Logo.svg', 'none'],

  /* 10 */
  ['CALVIN KLEIN', 'MINIMALIST APPAREL', 'MODERNIST ESSENTIALS', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/e/e2/Calvin_klein_logo.svg', 'none'],

  /* 11 */
  ["L'ORÉAL", 'BEAUTY CONGLOMERATE', 'COSMETICS GIANT', '#f9f6f0',
   'https://upload.wikimedia.org/wikipedia/commons/9/9d/L%27Or%C3%A9al_logo.svg', 'none'],

  /* 12 */
  ['THE NEW YORK TIMES', 'GLOBAL JOURNALISM', 'ESTABLISHED 1851', '#fcfbf8',
   'https://upload.wikimedia.org/wikipedia/commons/0/02/The_New_York_Times_Logo.svg', 'none'],

  /* 13 */
  ['VISA', 'PAYMENT NETWORK', 'GLOBAL PAYMENTS', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/5/5c/Visa_Inc._logo_%282021%E2%80%93present%29.svg', 'none'],

  /* 14 */
  ['CNN', 'BROADCAST NEWS', 'CABLE NEWS NETWORK', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/b/b1/CNN.svg', 'none'],

  /* 15 */
  ['HBO', 'ENTERTAINMENT', 'PREMIUM TELEVISION', '#060709',
   'https://upload.wikimedia.org/wikipedia/commons/d/de/HBO_logo.svg', 'invert(1)'],

  /* 16 */
  ['DISNEY', 'ENTERTAINMENT TITAN', 'GLOBAL STORYTELLING', '#f2f5fb',
   'https://upload.wikimedia.org/wikipedia/commons/a/a4/Disney_wordmark.svg', 'none'],

  /* 17 */
  ['NETFLIX', 'STREAMING ENTERTAINMENT', 'ENTERTAINMENT LEADER', '#000000',
   'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg', 'none'],

  /* 18 */
  ['SUBWAY', 'FAST CASUAL DINING', 'FRESH SANDWICHES', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/5/5c/Subway_2016_logo.svg', 'none'],

  /* 19 */
  ['NUTELLA', 'GLOBAL FOOD ICON', 'HAZELNUT SPREAD', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/f/f1/Nutella_logo.svg', 'none'],

  /* 20 */
  ['INTEL', 'SEMICONDUCTORS', 'SILICON PIONEER', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/6/6a/Intel_logo_%282020%2C_dark_blue%29.svg', 'none'],

  /* 21 */
  ['NOKIA', 'TELECOMMUNICATIONS', 'NETWORK INFRASTRUCTURE', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/0/02/Nokia_wordmark.svg', 'none'],

  /* 22 */
  ['GOOGLE', 'SEARCH & CLOUD', 'MULTIBILLION USERS', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/e/ee/Google_2026_logo.svg', 'none'],

  /* 23 */
  ['SONY', 'CONSUMER ELECTRONICS', 'AUDIO & PLAYSTATION', '#050505',
   'https://upload.wikimedia.org/wikipedia/commons/c/ca/Sony_logo.svg', 'invert(1)'],

  /* 24 */
  ['EBAY', 'ONLINE MARKETPLACE', 'GLOBAL COMMERCE', '#ffffff',
   'https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg', 'none']
];

/* -------------------------------------------------------------
   BUILD SLIDES IN DOM
------------------------------------------------------------- */
const slidesContainer = $('slides-container');
const slideElements = [];

function buildSlides() {
  BRANDS.forEach((b, i) => {
    const s = document.createElement('div');
    s.className = 'slide' + (i === 0 ? ' active' : '');
    s.id = `slide-${i}`;
    const img = document.createElement('img');
    img.src = b[4];
    img.alt = b[0];
    img.style.filter = b[5];
    img.loading = 'eager';
    s.appendChild(img);
    slidesContainer.appendChild(s);
    slideElements.push(s);
  });
}

function preloadAllImages() {
  const jobs = BRANDS.map((b) => new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => {
      console.warn("Logo load fallback for:", b[0]);
      resolve(false);
    };
    img.src = b[4];
  }));
  return Promise.all(jobs);
}

/* -------------------------------------------------------------
   AUDIO SYNTHESIZER (SFX ONLY, NO MUSIC - RULE 2)
------------------------------------------------------------- */
let REC = null, curT = 0, lastT = -1, lastIdx = -1, lastN = -1;
const nbuf = ctx => {
  if (ctx.__nb) return ctx.__nb;
  const n = ctx.sampleRate, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  let q = 1234567;
  for (let i = 0; i < n; i++) {
    q = (q * 1664525 + 1013904223) >>> 0;
    d[i] = q / 2147483648 - 1;
  }
  return ctx.__nb = b;
};

function synth(ctx, dst, type, when, v, seed) {
  if (type === 'snap') {
    /* Mechanical shutter click / slide changer click on each logo change */
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = nbuf(ctx);
    f.type = 'bandpass';
    f.Q.value = 2.4;
    const fr = 2700 * (1 + ((seed || 0) % 7 - 3) * 0.05);
    f.frequency.setValueAtTime(fr, when);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.55 * v, when + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.035);
    n.connect(f); f.connect(g); g.connect(dst);
    n.start(when, ((seed || 0) * 0.041) % 0.5, 0.04);

    const osc = ctx.createOscillator(), og = ctx.createGain();
    osc.type = 'sine';
    const pitch = 155 + ((seed || 0) % 5) * 12;
    osc.frequency.setValueAtTime(pitch, when);
    osc.frequency.exponentialRampToValueAtTime(30, when + 0.04);
    og.gain.setValueAtTime(0.35 * v, when);
    og.gain.exponentialRampToValueAtTime(0.0001, when + 0.04);
    osc.connect(og); og.connect(dst);
    osc.start(when); osc.stop(when + 0.045);
  } else if (type === 'type') {
    /* Crisp mechanical keyboard click */
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = nbuf(ctx);
    f.type = 'bandpass';
    f.Q.value = 1.4;
    f.frequency.setValueAtTime(2100 * (1 + ((seed || 0) % 5 - 2) * 0.06), when);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.3 * v, when + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.028);
    n.connect(f); f.connect(g); g.connect(dst);
    n.start(when, ((seed || 0) * 0.023) % 0.5, 0.035);
  } else if (type === 'thud') {
    /* Sub bass kick punch on punchline hit */
    const osc = ctx.createOscillator(), og = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, when);
    osc.frequency.exponentialRampToValueAtTime(28, when + 0.22);
    og.gain.setValueAtTime(0.85 * v, when);
    og.gain.exponentialRampToValueAtTime(0.0001, when + 0.22);
    osc.connect(og); og.connect(dst);
    osc.start(when); osc.stop(when + 0.23);
  } else if (type === 'whoosh') {
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = nbuf(ctx);
    f.type = 'bandpass';
    f.Q.value = 0.85;
    f.frequency.setValueAtTime(380, when);
    f.frequency.exponentialRampToValueAtTime(3400, when + 0.35);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.5 * v, when + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.35);
    n.connect(f); f.connect(g); g.connect(dst);
    n.start(when, 0, 0.38);
  }
}

function emit(type, v = 1, seed = 0) {
  if (REC) REC.push({ t: +curT.toFixed(4), type, v, seed });
}

function resetSfxState() {
  lastIdx = -1;
  lastT = -1;
  lastN = -1;
}

function recordAudio() {
  REC = [{ t: 0, type: 'whoosh', v: 0.8, seed: 0 }];
  resetSfxState();
  for (let i = 0; i < DUR * 30; i++) renderFrame(i / 30);
  window.REEL.audioEvents = REC;
  REC = null;
  resetSfxState();
  renderFrame(0);
}

window.renderAudio = async () => {
  if (!window.REEL.audioEvents) recordAudio();
  const sr = 44100, ctx = new OfflineAudioContext(2, Math.round(sr * DUR), sr);
  const comp = ctx.createDynamicsCompressor(), m = ctx.createGain();
  m.gain.value = 0.95;
  m.connect(comp);
  comp.connect(ctx.destination);
  window.REEL.audioEvents.forEach(e => synth(ctx, m, e.type, e.t, e.v, e.seed));

  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const w = (o, t) => { for (let i = 0; i < t.length; i++) out.setUint8(o + i, t.charCodeAt(i)); };
  w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
  w(36, 'data'); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true);
    out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true);
  }
  const u8 = new Uint8Array(out.buffer);
  let bin = '';
  for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return btoa(bin);
};

/* -------------------------------------------------------------
   RENDER FRAME DETERMINISTIC LOGIC
------------------------------------------------------------- */
const card = $('card');
const flash = $('flash');
const cnt = $('cnt');
const tag = $('tag');
const val = $('val');
const runner = $('runner');
const tyLine = $('ty-line');
const cur = $('cur');

const TXT_PART1 = "you are burning your capital ";
const TXT_PART2 = "on just a logo.";
const FULL_TXT = TXT_PART1 + TXT_PART2;

function renderFrame(t) {
  t = ((t % DUR) + DUR) % DUR;
  curT = t;

  /* Turnaround whoosh */
  if (lastT >= 0 && t < lastT - 0.5) emit('whoosh', 0.85);

  /* Runner bar */
  runner.style.width = ((t / DUR) * 100).toFixed(2) + '%';

  /* 1. Fast logo index (24 brands over 7.0 seconds => ~0.291s per brand) */
  const N_BRANDS = BRANDS.length;
  const brandIdx = Math.min(N_BRANDS - 1, Math.floor((t / DUR) * N_BRANDS));

  if (brandIdx !== lastIdx) {
    const b = BRANDS[brandIdx];
    card.style.background = b[3];
    slideElements.forEach((el, idx) => {
      el.classList.toggle('active', idx === brandIdx);
    });
    cnt.innerHTML = `<b>${String(brandIdx + 1).padStart(2, '0')}</b> / ${N_BRANDS}`;
    tag.textContent = b[1];
    val.textContent = b[2];
    emit('snap', 0.9, brandIdx);
    lastIdx = brandIdx;
  }

  /* Micro shutter flash on frame 0 of switch */
  const subProg = ((t / DUR) * N_BRANDS) % 1;
  flash.style.opacity = subProg < 0.22 ? (1 - subProg / 0.22) * 0.28 : 0;

  /* 2. Bottom typing text logic (Types 0.4s -> 2.9s, holds with thud, loops) */
  let chars = 0;
  if (t < 0.4) chars = 0;
  else if (t < 2.9) chars = Math.round(FULL_TXT.length * clamp((t - 0.4) / 2.5));
  else chars = FULL_TXT.length;

  if (chars !== lastN) {
    if (lastN >= 0 && chars > lastN) {
      emit('type', 0.75, chars);
      if (chars === FULL_TXT.length) emit('thud', 0.9, 99);
    }
    const currentTyped = FULL_TXT.slice(0, chars);
    if (chars <= TXT_PART1.length) {
      tyLine.innerHTML = currentTyped;
    } else {
      const p1 = TXT_PART1;
      const p2 = currentTyped.slice(TXT_PART1.length);
      tyLine.innerHTML = `${p1}<span class="hl">${p2}</span>`;
    }
    lastN = chars;
  }

  /* Cursor blink */
  const typing = t < 2.9;
  cur.style.opacity = (typing || Math.floor(t * 3.5) % 2 === 0) ? 1 : 0;

  lastT = t;
}
window.renderFrame = renderFrame;

/* Interactive Preview Scaler for normal browser viewing */
function preview() {
  const vp = $('vp');
  const f = () => {
    const s = Math.min(innerWidth / W, innerHeight / H);
    vp.style.transform = `scale(${s})`;
    vp.style.left = (innerWidth - W * s) / 2 + 'px';
    vp.style.top = (innerHeight - H * s) / 2 + 'px';
  };
  addEventListener('resize', f);
  f();
  const t0 = performance.now();
  (function lp() {
    renderFrame((performance.now() - t0) / 1000);
    requestAnimationFrame(lp);
  })();
}

/* Boot & Ready signal for render.py */
(async () => {
  try {
    buildSlides();
    await Promise.all([document.fonts.ready, preloadAllImages()]);
    renderFrame(0);
    if (RENDER) recordAudio();
    else preview();
    window.__reelReady = true;
  } catch (e) {
    window.__reelError = String(e && e.stack || e);
  }
})();
})();
</script>
